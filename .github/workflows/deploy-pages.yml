# Builds the static export and publishes it to GitHub Pages. The site is a
# project page, so it lives under /gridfinity-tray — `npm run build:pages` sets
# the base path that every asset URL (and the worker's WASM fetch) needs.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it: a half-deployed Pages site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prebuild:pages copies the OpenCASCADE WASM into public/, which is gitignored.
      - run: npm run build:pages
      - run: npx eslint src --max-warnings 0
      # Pages would otherwise let Jekyll skip _next/, where every asset lives.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
